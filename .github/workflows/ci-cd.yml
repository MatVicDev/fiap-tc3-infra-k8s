name: CI/CD

on:
  push:
    branches: [main, homologacao]
  pull_request:
    branches: [main, homologacao]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.5"

      - name: Formatação e sintaxe
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          echo '{"Version":"2012-10-17","Statement":[]}' > iam/alb-controller-policy.json
          terraform init -backend=false
          terraform validate

  apply:
    needs: validate
    if: github.event_name == 'push' && vars.DEPLOY_TO_AWS == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Baixar policy oficial do AWS Load Balancer Controller
        run: |
          curl -o terraform/iam/alb-controller-policy.json \
            https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/main/docs/install/iam_policy.json

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.5"

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_ambiente: ${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}
          TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
        run: |
          terraform init
          terraform apply -auto-approve
